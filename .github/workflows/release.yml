name: Release HideLyric

on:
  push:
    tags:
      - "v*"


permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Check version
        shell: pwsh
        run: |
          $manifest =
              Get-Content ".\manifest.json" -Raw |
              ConvertFrom-Json

          $manifestVersion =
              $manifest.version

          $tagVersion =
              $env:GITHUB_REF_NAME

          $expectedTag =
              "v$manifestVersion"

          if ($tagVersion -ne $expectedTag) {
              Write-Error `
                "版本不一致:manifest=$expectedTag, tag=$tagVersion"

              exit 1
          }

          Write-Host `
            "版本检查通过:$tagVersion"


      - name: Build Release
        run: cargo build --release


      - name: Prepare plugin
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            ".\plugin"

          Copy-Item `
            ".\manifest.json" `
            ".\plugin\manifest.json" `
            -Force

          Copy-Item `
            ".\main.js" `
            ".\plugin\main.js" `
            -Force

          Copy-Item `
            ".\preview.png" `
            ".\plugin\preview.png" `
            -Force

          Copy-Item `
            ".\target\release\HideLyric.exe" `
            ".\plugin\HideLyric.exe" `
            -Force


      - name: Package plugin
        shell: pwsh
        run: |
          $tag =
              $env:GITHUB_REF_NAME

          $zip =
              "HideLyric-$tag.zip"

          $plugin =
              "HideLyric-$tag.plugin"

          Compress-Archive `
            -Path ".\plugin\*" `
            -DestinationPath ".\$zip" `
            -Force

          Rename-Item `
            ".\$zip" `
            ".\$plugin"

          Write-Host `
            "生成插件: $plugin"


      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag =
              $env:GITHUB_REF_NAME

          $plugin =
              "HideLyric-$tag.plugin"

          gh release create `
            $tag `
            ".\$plugin" `
            --verify-tag `
            --title "HideLyric $tag" `
            --generate-notes